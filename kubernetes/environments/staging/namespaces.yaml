# Namespace for staging environment
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    name: staging
    environment: staging
  annotations:
    description: "Staging environment for e-commerce microservices"
---
# Namespace for monitoring stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    component: monitoring
  annotations:
    description: "Monitoring stack with Prometheus and Grafana"