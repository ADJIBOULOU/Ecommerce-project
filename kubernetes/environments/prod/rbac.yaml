# RBAC Configuration for Production Environment

# Service Account for production
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-service-account
  namespace: production
  labels:
    app: ecommerce-platform
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ecommerce-platform-prod-eks-service-role"
---
# Production Role (more restrictive)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: production
  name: production-role
  labels:
    app: ecommerce-platform
    environment: production
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
# Production RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: production-role-binding
  namespace: production
  labels:
    app: ecommerce-platform
    environment: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: production-role
subjects:
- kind: ServiceAccount
  name: ecommerce-service-account
  namespace: production