# Network Policies for Production Environment (Strict Security)

# Default deny all ingress traffic policy for production
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: production
  labels:
    app: ecommerce-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Allow ingress traffic for product-catalog service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-catalog-network-policy
  namespace: production
  labels:
    app: product-catalog
spec:
  podSelector:
    matchLabels:
      app: product-catalog
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    - podSelector:
        matchLabels:
          app: user-accounts
    - podSelector:
        matchLabels:
          app: shopping-cart
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 5432  # PostgreSQL
---
