# Namespace for development environment
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    name: dev
    environment: development
  annotations:
    description: "Development environment for e-commerce microservices"
---
# Namespace for monitoring stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    component: monitoring
  annotations:
    description: "Monitoring stack with Prometheus and Grafana"