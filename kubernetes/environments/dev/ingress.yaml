# Development Environment Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-dev-ingress
  namespace: dev
  labels:
    app: ecommerce-platform
    environment: dev
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/load-balancer-name: ecommerce-platform-dev-alb
    alb.ingress.kubernetes.io/tags: |
      Environment=development,
      Project=ecommerce-platform,
      ManagedBy=k8s-ingress
spec:
  rules:
  - host: dev-api.ecommerce-platform.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: product-catalog-service
            port:
              number: 80