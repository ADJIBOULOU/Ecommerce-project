# Staging environment values for Payment Processing service

replicaCount: 2

image:
  repository: your-account.dkr.ecr.us-west-2.amazonaws.com/payment-processing
  pullPolicy: Always
  tag: "staging-latest"

resources:
  limits:
    cpu: 1500m
    memory: 1.5Gi
  requests:
    cpu: 300m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  database:
    host: "postgres-staging.staging.svc.cluster.local"
    name: "paymentdb_staging"
  payment_gateways:
    stripe:
      api_url: "https://api.stripe.com"
    paypal:
      api_url: "https://api.sandbox.paypal.com"  # Still use sandbox for staging
  feature_flags:
    enable_fraud_detection: "true"
    enable_retry_logic: "true"
    payment_timeout: "120"  # 2 minutes

env:
  - name: NODE_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"

secret:
  database:
    username: "payment_user_staging"
    password: "staging_secure_password"
  payment_gateways:
    stripe:
      api_key: "sk_test_staging_key"
    paypal:
      client_id: "staging_paypal_client"