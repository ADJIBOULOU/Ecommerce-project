apiVersion: v1
kind: Secret
metadata:
  name: {{ include "product-catalog.fullname" . }}-secret
  labels:
    {{- include "product-catalog.labels" . | nindent 4 }}
type: Opaque
data:
  database.username: {{ .Values.secrets.database.username | b64enc }}
  database.password: {{ .Values.secrets.database.password | b64enc }}
  {{- if .Values.secrets.redis.password }}
  redis.password: {{ .Values.secrets.redis.password | b64enc }}
  {{- end }}