# Staging environment values for User Accounts service

# Override default values for staging environment
replicaCount: 2

image:
  repository: your-account.dkr.ecr.us-west-2.amazonaws.com/user-accounts
  pullPolicy: Always
  tag: "staging-latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:ACCOUNT:certificate/CERT-ID
    alb.ingress.kubernetes.io/tags: |
      Environment=staging,
      Project=ecommerce-platform,
      ManagedBy=k8s-ingress
  hosts:
    - host: staging-api.ecommerce-platform.com
      paths:
        - path: /api/users
          pathType: Prefix
  tls:
    - secretName: staging-tls
      hosts:
        - staging-api.ecommerce-platform.com

# Resource limits for staging (production-like)
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling enabled for staging
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget enabled
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Node selection for staging
nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - user-accounts
          topologyKey: kubernetes.io/hostname

# Health checks with production-like timings
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables for staging
env:
  - name: PORT
    value: "8080"
  - name: NODE_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"
  - name: DEBUG
    value: "false"

# ConfigMap for application configuration
config:
  database:
    host: "postgres-staging.staging.svc.cluster.local"
    port: "5432"
    name: "userdb_staging"
  redis:
    host: "redis-staging.staging.svc.cluster.local"
    port: "6379"
  jwt:
    expiration: "24h"
  oauth:
    google:
      enabled: "true"
    github:
      enabled: "true"

# Secret configuration
secret:
  database:
    username: "user_account_staging"
    password: "staging_secure_password"
  redis:
    password: "staging_redis_secure_pass"
  jwt:
    secret: "staging_jwt_secure_key"
  oauth:
    google:
      client_id: "staging_google_client_id"
      client_secret: "staging_google_secret"
    github:
      client_id: "staging_github_client_id"
      client_secret: "staging_github_secret"