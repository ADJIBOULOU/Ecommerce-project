# Default values for product-catalog microservice

replicaCount: 3

image:
  repository: your-registry/product-catalog
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: product-catalog.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - product-catalog
          topologyKey: kubernetes.io/hostname

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables
env:
  - name: PORT
    value: "8080"
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"

# ConfigMap for application configuration
config:
  database:
    host: "postgres-service.default.svc.cluster.local"
    port: "5432"
    name: "productdb"
  redis:
    host: "redis-service.default.svc.cluster.local"
    port: "6379"
  feature_flags:
    enable_caching: "true"
    enable_recommendations: "true"

# Secret for sensitive data
secrets:
  database:
    username: "product_user"
    password: "your-secure-password"
  redis:
    password: ""

# Persistent Volume Claims
persistence:
  enabled: false
  storageClass: "gp2"
  accessMode: ReadWriteOnce
  size: 8Gi

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: nginx-ingress
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: user-accounts
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: shopping-cart
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postgres
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: redis