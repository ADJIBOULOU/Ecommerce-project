# Development environment values for Product Catalog service

# Override default values for development environment
replicaCount: 1

image:
  repository: your-account.dkr.ecr.us-west-2.amazonaws.com/product-catalog
  pullPolicy: Always
  tag: "dev-latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/tags: |
      Environment=development,
      Project=ecommerce-platform,
      ManagedBy=k8s-ingress
  hosts:
    - host: dev-api.ecommerce-platform.local
      paths:
        - path: /api/products
          pathType: Prefix
  tls: []

# Resource limits for development (reduced for cost)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling disabled for development
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Reduced disruption budget for dev
podDisruptionBudget:
  enabled: false

# Node selection for development
nodeSelector:
  kubernetes.io/arch: amd64

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - product-catalog
          topologyKey: kubernetes.io/hostname

# Health checks with relaxed timings for dev
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 60
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

# Environment variables for development
env:
  - name: PORT
    value: "8080"
  - name: NODE_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: DEBUG
    value: "true"

# ConfigMap for application configuration
config:
  database:
    host: "postgres-dev.dev.svc.cluster.local"
    port: "5432"
    name: "productdb_dev"
  redis:
    host: "redis-dev.dev.svc.cluster.local"
    port: "6379"
  feature_flags:
    enable_caching: "false"  # Disabled for easier debugging
    enable_recommendations: "true"

# Secret configuration
secret:
  database:
    username: "product_user_dev"
    password: "dev_password_123"  # Use secrets manager in production
  redis:
    password: "dev_redis_pass"
  jwt:
    secret: "dev_jwt_secret_key"