# Staging environment values for Order Management service

replicaCount: 2

image:
  repository: your-account.dkr.ecr.us-west-2.amazonaws.com/order-management
  pullPolicy: Always
  tag: "staging-latest"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

config:
  database:
    host: "postgres-staging.staging.svc.cluster.local"
    name: "orderdb_staging"
  message_queue:
    host: "rabbitmq-staging.staging.svc.cluster.local"
  feature_flags:
    enable_notifications: "true"
    enable_inventory_check: "true"
    order_timeout: "3600"  # 1 hour

env:
  - name: NODE_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"

secret:
  database:
    username: "order_user_staging"
    password: "staging_secure_password"