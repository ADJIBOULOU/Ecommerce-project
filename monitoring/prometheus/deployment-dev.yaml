# Environment-specific Prometheus deployment configurations

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-dev
  namespace: monitoring
  labels:
    app: prometheus
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      environment: dev
  template:
    metadata:
      labels:
        app: prometheus
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=7d'  # Shorter retention for dev
          - '--web.enable-lifecycle'
          - '--log.level=debug'  # More verbose logging for dev
        ports:
        - containerPort: 9090
        resources:
          limits:
            cpu: 200m      # Light limits for dev
            memory: 1Gi
            ephemeral-storage: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
            ephemeral-storage: 512Mi
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
        - name: prometheus-storage-volume
          mountPath: /prometheus/
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config-volume
        configMap:
          defaultMode: 420
          name: prometheus-config-dev
      - name: prometheus-storage-volume
        persistentVolumeClaim:
          claimName: prometheus-pvc-dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc-dev
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 20Gi  # Smaller storage for dev