# Environment-specific Prometheus deployment for staging

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-staging
  namespace: monitoring
  labels:
    app: prometheus
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      environment: staging
  template:
    metadata:
      labels:
        app: prometheus
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=14d'  # Medium retention for staging
          - '--web.enable-lifecycle'
          - '--log.level=info'  # Standard logging for staging
        ports:
        - containerPort: 9090
        resources:
          limits:
            cpu: 400m      # Medium limits for staging
            memory: 1.5Gi
            ephemeral-storage: 1.5Gi
          requests:
            cpu: 200m
            memory: 768Mi
            ephemeral-storage: 768Mi
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
        - name: prometheus-storage-volume
          mountPath: /prometheus/
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config-volume
        configMap:
          defaultMode: 420
          name: prometheus-config-staging
      - name: prometheus-storage-volume
        persistentVolumeClaim:
          claimName: prometheus-pvc-staging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc-staging
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 40Gi  # Medium storage for staging