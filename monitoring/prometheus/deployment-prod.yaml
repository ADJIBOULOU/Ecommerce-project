# Environment-specific Prometheus deployment for production

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-prod
  namespace: monitoring
  labels:
    app: prometheus
    environment: prod
spec:
  replicas: 2  # High availability for production
  selector:
    matchLabels:
      app: prometheus
      environment: prod
  template:
    metadata:
      labels:
        app: prometheus
        environment: prod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v2.47.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=30d'  # Longer retention for production
          - '--web.enable-lifecycle'
          - '--log.level=warn'  # Reduced logging for production performance
        ports:
        - containerPort: 9090
        resources:
          limits:
            cpu: 800m       # High limits for production
            memory: 3Gi
            ephemeral-storage: 2Gi
          requests:
            cpu: 400m
            memory: 1.5Gi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus/
        - name: prometheus-storage-volume
          mountPath: /prometheus/
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config-volume
        configMap:
          defaultMode: 420
          name: prometheus-config-prod
      - name: prometheus-storage-volume
        persistentVolumeClaim:
          claimName: prometheus-pvc-prod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc-prod
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 100Gi  # Large storage for production