apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-staging
  namespace: monitoring
data:
  prometheus.yaml: |-
    {
        "apiVersion": 1,
        "datasources": [
            {
               "access":"proxy",
                "editable": true,
                "name": "prometheus-staging",
                "orgId": 1,
                "type": "prometheus",
                "url": "http://prometheus:9090",
                "version": 1,
                "jsonData": {
                    "timeInterval": "15s"
                }
            }
        ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config-staging
  namespace: monitoring
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    
    [log]
    mode = console
    level = info
    
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    protocol = http
    http_port = 3000
    root_url = http://grafana-staging.monitoring.svc.cluster.local:3000
    
    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    
    [auth.anonymous]
    enabled = false
    
    [security]
    admin_user = admin
    admin_password = staging-secure-password
    
    [dashboards]
    default_home_dashboard_path = /etc/grafana/provisioning/dashboards/staging-overview.json