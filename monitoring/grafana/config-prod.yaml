apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-prod
  namespace: monitoring
data:
  prometheus.yaml: |-
    {
        "apiVersion": 1,
        "datasources": [
            {
               "access":"proxy",
                "editable": false,
                "name": "prometheus-prod",
                "orgId": 1,
                "type": "prometheus",
                "url": "http://prometheus:9090",
                "version": 1,
                "jsonData": {
                    "timeInterval": "15s",
                    "queryTimeout": "60s"
                }
            }
        ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config-prod
  namespace: monitoring
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    
    [log]
    mode = console
    level = warn
    
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    protocol = http
    http_port = 3000
    root_url = https://grafana.ecommerce.example.com
    
    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    
    [auth.anonymous]
    enabled = false
    
    [security]
    admin_user = admin
    admin_password = production-super-secure-password-change-me
    secret_key = production-secret-key-change-me
    
    [session]
    session_life_time = 86400
    
    [dashboards]
    default_home_dashboard_path = /etc/grafana/provisioning/dashboards/production-overview.json
    
    [alerting]
    enabled = true
    execute_alerts = true
    
    [smtp]
    enabled = false
    # Configure SMTP settings for production alerts
    # host = smtp.example.com:587
    # user = grafana@example.com
    # password = smtp-password
    # from_address = grafana@example.com