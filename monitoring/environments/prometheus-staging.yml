# Staging environment Prometheus configuration

global:
  scrape_interval: 15s      # More frequent than dev
  evaluation_interval: 15s  # More frequent than dev
  external_labels:
    cluster: 'ecommerce-platform-staging-eks'
    environment: 'staging'
    region: 'us-west-2'

rule_files:
  - "alert_rules_staging.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Kubernetes API server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - default
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  # Kubernetes pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

  # Application services in staging namespace
  - job_name: 'ecommerce-services-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service

  # Individual microservices monitoring for staging
  - job_name: 'product-catalog-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: product-catalog.*
    scrape_interval: 30s

  - job_name: 'user-accounts-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: user-accounts.*
    scrape_interval: 30s

  - job_name: 'shopping-cart-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: shopping-cart.*
    scrape_interval: 30s

  - job_name: 'order-management-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: order-management.*
    scrape_interval: 30s

  - job_name: 'payment-processing-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: payment-processing.*
    scrape_interval: 15s  # More frequent for payment service

  # Node Exporter for staging
  - job_name: 'node-exporter-staging'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        action: keep
        regex: node-exporter
    scrape_interval: 30s