# Production environment Prometheus configuration

global:
  scrape_interval: 15s      # High frequency for production monitoring
  evaluation_interval: 15s  # High frequency for production alerting
  external_labels:
    cluster: 'ecommerce-platform-prod-eks'
    environment: 'production'
    region: 'us-west-2'

rule_files:
  - "alert_rules_prod.yml"
  - "sla_rules.yml"
  - "business_metrics_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      path_prefix: /alertmanager
      timeout: 10s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Kubernetes API server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - default
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes nodes (comprehensive monitoring)
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    scrape_interval: 15s

  # Node Exporter
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        action: keep
        regex: node-exporter
    scrape_interval: 15s

  # Kube State Metrics
  - job_name: 'kube-state-metrics'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        action: keep
        regex: kube-state-metrics
    scrape_interval: 15s

  # Application services in production namespace
  - job_name: 'ecommerce-services-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
    scrape_interval: 15s

  # Product Catalog Service
  - job_name: 'product-catalog-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: product-catalog.*
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    scrape_interval: 10s
    metrics_path: /metrics

  # User Accounts Service
  - job_name: 'user-accounts-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: user-accounts.*
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    scrape_interval: 10s
    metrics_path: /metrics

  # Shopping Cart Service
  - job_name: 'shopping-cart-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: shopping-cart.*
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    scrape_interval: 10s
    metrics_path: /metrics

  # Order Management Service
  - job_name: 'order-management-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: order-management.*
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    scrape_interval: 10s
    metrics_path: /metrics

  # Payment Processing Service (Critical monitoring)
  - job_name: 'payment-processing-production'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - production
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: payment-processing.*
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    scrape_interval: 5s  # More frequent monitoring for payment service
    metrics_path: /metrics

  # Ingress Nginx Controller
  - job_name: 'nginx-ingress-controller'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ingress-nginx
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
    scrape_interval: 15s

  # CoreDNS
  - job_name: 'coredns'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: kube-dns
    scrape_interval: 15s

