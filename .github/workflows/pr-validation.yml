  # Notify status
  notify-pr-status:
    name: 'PR Status Notification'
    runs-on: ubuntu-latest
    needs: [terraform-validate, k8s-lint, helm-validate, helm-test]
    if: always()
    
    steps:
    - name: PR Status Check
      run: |
        if [[ "${{ needs.terraform-validate.result }}" == "success" && \
              "${{ needs.k8s-lint.result }}" == "success" && \
              "${{ needs.helm-validate.result }}" == "success" && \
              "${{ needs.security-scan.result }}" == "success" && \
              "${{ needs.helm-test.result }}" == "success" && \
              "${{ needs.code-quality.result }}" == "success" && \
              "${{ needs.docs-check.result }}" == "success" ]]; then
          echo "✅ All PR validation checks passed!"
        else
          echo "❌ Some PR validation checks failed!"
          exit 1
        fi
