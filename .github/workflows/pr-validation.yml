  # Test Helm chart installation
  helm-test:
    name: 'Test Helm Installation'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
    
    - name: Setup kind cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: test-cluster
    
    - name: Test Helm chart installation
      run: |
        # Test each chart installation
        for chart in product-catalog user-accounts shopping-cart order-management payment-processing; do
          echo "Testing $chart chart installation..."
          helm install test-$chart ./helm-charts/$chart \
            --dry-run \
            --debug \
            --set image.repository=nginx \
            --set image.tag=latest
        done

