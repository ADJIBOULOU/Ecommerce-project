name: Pull Request Validation

on:
  pull_request:
    branches: [ develop, master, release ]

env:
  AWS_REGION: us-west-2

jobs:
  # Validate Terraform
  terraform-validate:
    name: 'Validate Terraform'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
    
    - name: Validate All Terraform Environments
      run: |
        # Define environments array
        environments=("dev" "staging" "prod")
        
        # Loop through each environment
        for env in "${environments[@]}"; do
          echo "🔍 Validating Terraform for environment: $env"
          
          cd ./terraform/environments/$env
          
          # Format check
          echo "📋 Checking Terraform format..."
          terraform fmt -check -recursive
          
          # Initialize without backend
          echo "🔧 Initializing Terraform..."
          terraform init -backend=false
          
          # Validate configuration
          echo "✅ Validating Terraform configuration..."
          terraform validate
          
          # Return to root directory
          cd ../../..
          
          echo "✅ Environment $env validation completed successfully"
        done

  # Lint Kubernetes manifests
  k8s-lint:
    name: 'Lint Kubernetes Manifests'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Lint Kubernetes manifests
      run: |
        find kubernetes/ -name '*.yaml' -o -name '*.yml' | xargs -I {} kubectl --dry-run=client --validate=true apply -f {}

  # Validate Helm charts
  helm-validate:
    name: 'Validate Helm Charts'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
    
    - name: Validate All Helm Charts
      run: |
        # Define charts array
        charts=("product-catalog" "user-accounts" "shopping-cart" "order-management" "payment-processing")
        
        # Loop through each chart
        for chart in "${charts[@]}"; do
          echo "🔍 Validating Helm chart: $chart"
          
          # Lint Helm chart
          echo "📋 Linting Helm chart..."
          helm lint ./helm-charts/$chart
          
          # Template Helm chart
          echo "🔧 Templating Helm chart..."
          helm template test ./helm-charts/$chart --debug --dry-run
          
          echo "✅ Chart $chart validation completed successfully"
        done

