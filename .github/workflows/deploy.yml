name: Deploy to EKS

on:
  pull_request:
    branches: [ develop, master, release ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

env:
  AWS_REGION: us-west-2
  
jobs:
  # Determine environment based on branch
  setup:
    name: 'Setup Environment Variables'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      terraform_dir: ${{ steps.env.outputs.terraform_dir }}
      cluster_name: ${{ steps.env.outputs.cluster_name }}
      namespace: ${{ steps.env.outputs.namespace }}
    steps:
    - name: Determine environment
      id: env
      run: |
        if [ "${{ github.event.inputs.environment }}" != "" ]; then
          # Manual workflow dispatch
          ENV="${{ github.event.inputs.environment }}"
        elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
          ENV="dev"
        elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
          ENV="staging"
        elif [ "${{ github.ref }}" = "refs/heads/release" ]; then
          ENV="production"
        else
          ENV="dev"  # default fallback
        fi
        
        # Set terraform directory
        if [ "$ENV" = "production" ]; then
          TERRAFORM_DIR="prod"
        else
          TERRAFORM_DIR="$ENV"
        fi
        
        # Set cluster name
        CLUSTER_NAME="ecommerce-platform-${ENV}-eks"
        
        echo "environment=$ENV" >> $GITHUB_OUTPUT
        echo "terraform_dir=$TERRAFORM_DIR" >> $GITHUB_OUTPUT
        echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        echo "namespace=$ENV" >> $GITHUB_OUTPUT
        
        echo "🚀 Deploying to: $ENV environment"
        echo "📁 Terraform directory: $TERRAFORM_DIR"
        echo "🎯 EKS Cluster: $CLUSTER_NAME"
        echo "📦 Namespace: $ENV"

  # Infrastructure deployment
  terraform:
    name: 'Terraform Infrastructure'
    runs-on: ubuntu-latest
    needs: [setup]
    environment: ${{ needs.setup.outputs.environment }}
    
    defaults:
      run:
        shell: bash
        working-directory: ./terraform/environments/${{ needs.setup.outputs.terraform_dir }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
    
    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      continue-on-error: true
    
    - name: Terraform Init
      id: init
      run: terraform init
    
    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
    
    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -input=false
      continue-on-error: true
    
    - name: Update Pull Request
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

          <details><summary>Show Plan</summary>

          \`\`\`\n
          ${process.env.PLAN}
          \`\`\`

          </details>

          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
    
    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
    
    - name: Terraform Apply
      if: github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

